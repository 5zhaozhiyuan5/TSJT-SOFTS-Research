  target_few_shot:
      add_target: true
      batch_size: 46
      his_num: 288
      pred_num: 36
      task_num: 2

model:
  STnet:
    #target_lr : 0.0001
    lr : 0.001
  # Stage-I Continuous Horizon-conditioned Transfer Alignment (CHTA).
  # SOFTS and the official PMME Stage-II implementation remain unchanged.
  # Four physical-time anchors supervise a continuous shared horizon function;
  # conditional transport plans are KL-reweighted from one sampled base plan.
  # Legacy CHTA is retained for ablation; the new branch uses pattern_moe.
  chta:
    enabled: false
    input_dim: 128
    horizon_steps: 36
    minutes_per_step: 5
    anchor_steps: [2, 12, 24, 36]
    time_dim: 16
    hidden_dim: 64
    relation_dim: 32
    epsilon: 0.08
    sinkhorn_iterations: 20
    max_samples: 128
    future_weight: 1.0
    prior_kl_weight: 1.0
    source_temperature: 0.25
    loss_weight: 0.1
    # FiLM time-conditioning smoothness remains enabled.
    smoothness_weight: 0.0001
    # Ablation: disable only cross-horizon router smoothing; keep its raw
    # diagnostic in moe_router.csv for comparison with the Balance baseline.
    router_smoothness_weight: 0.0
    target_loss_weight: 0.1

  # MTPB-inspired multi-scale pattern bank + horizon-conditioned dense MoE-OT.
  # The bank is built from source-city training windows only in train_DA_OT.py.
  pattern_moe:
    enabled: true
    input_dim: 128
    # Physical durations are converted to steps from data.processed_interval_minutes.
    anchor_minutes: [10, 60, 120, 180]
    scale_minutes: [60, 180, 360, 720, 1440]  # 1/3/6/12/24-hour history patterns
    num_prototypes: 10
    descriptor_bins: 16
    max_windows_per_city: 24
    max_nodes_per_city: 24
    max_patches_per_scale: 8000
    time_dim: 16
    hidden_dim: 64
    relation_dim: 32
    epsilon: 0.08
    sinkhorn_iterations: 20
    max_samples: 128
    pattern_temperature: 0.15
    router_temperature: 1.0
    # Soft anti-collapse floor: only prevents any expert's aggregate usage
    # from falling below 5%; it does not enforce uniform expert assignments.
    router_min_usage: 0.05
    router_balance_weight: 0.1
    future_weight: 1.0
    pattern_weight: 0.5
    prior_kl_weight: 1.0
    source_temperature: 0.25
    loss_weight: 1.0
    smoothness_weight: 0.0001
    target_loss_weight: 0.1
