name: Predictive overlap smoke
on:
  push:
    branches:
      - stage-1-predictive-overlap-ot-20261122
  workflow_dispatch:
jobs:
  cpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU torch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile modified Stage-I files
        run: python -m py_compile model/Meta_Models/PMME.py model/Meta_Models/predictive_overlap.py
      - name: Smoke test predictive masses
        run: python -m unittest discover -s tests -p 'test_predictive_overlap.py' -v
