name: STUNet diagnostics syntax

on:
  push:
    branches: [baseline/stunet-official-diagnostics-20261128]
  pull_request:
    branches: [baseline/stunet-official-diagnostics-20261128]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile diagnostic and upstream Python sources
        run: python -m compileall -q stunet_diagnostics scripts/run_stunet.py third_party/STUNet/src
