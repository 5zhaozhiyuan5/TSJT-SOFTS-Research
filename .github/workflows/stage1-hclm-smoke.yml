name: Stage-I HCLM smoke tests

on:
  push:
    branches:
      - stage-1-hclm
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install PMME runtime dependencies
        run: python -m pip install torch-geometric==2.6.1 gpytorch==1.14 geomloss==0.2.6 einops==0.8.1 scikit-learn pyyaml tqdm
      - name: Compile project Python files
        run: python -m compileall -q model/Meta_Models train_DA_OT.py datasets.py utils.py
      - name: Verify training entrypoint imports
        run: python train_DA_OT.py --help
      - name: Run module and training integration tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
