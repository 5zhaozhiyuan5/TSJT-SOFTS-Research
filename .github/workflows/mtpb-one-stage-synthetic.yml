name: MTPB one-stage synthetic regression
on:
  push:
    branches: [iteration/20261110-mtpb-retrieval-entropy-gradient]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy PyYAML pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: One-stage synthetic checks (NOT real traffic)
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q tests/test_mtpb_one_stage_gradient.py tests/test_mtpb_one_stage_eval.py tests/test_mtpb_train_only_norm.py tests/test_mtpb_retrieval_confidence.py
