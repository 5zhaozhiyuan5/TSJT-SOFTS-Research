name: Verify all three zero-inflated continuous datasets
on:
  push:
    branches:
      - datasets/continuous-zero-inflated-verified-20261126
    paths:
      - .github/workflows/verify-continuous-zero-datasets.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-real-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pinned upstream repositories and actual dataset bytes
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Verify source SHA and ZIP readability
        run: |
          python data/zero_inflated_papers/verify_datasets.py --json "$RUNNER_TEMP/zi_verified.json"
      - name: Inspect actual zero/positive values in all four rainfall CSVs and Chile input
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import zipfile
          from pathlib import Path
          base = Path("data/zero_inflated_papers")
          files = [
              base/"rainfallbench/stations/J340_data.csv",
              base/"rainfallbench/stations/ZIMM_data.csv",
              base/"rainfallbench/stations/P095_data.csv",
              base/"rainfallbench/stations/JFNG_data_15min.csv",
          ]
          cols = ["gpm_precip_sum_1h", "tp_era5", "tp", "precipitation"]
          def analyze(path, source):
              with source as f:
                  rdr = csv.DictReader(f)
                  present = [x for x in cols if x in (rdr.fieldnames or [])]
                  d = {x:{"valid":0, "zeros":0, "positive":0, "le_1e_6":0, "minimum":None, "maximum":None, "unique":set()} for x in present}
                  print("COLUMNS", path, rdr.fieldnames, flush=True)
                  for row in rdr:
                      for name in present:
                          try: v=float(row[name])
                          except (ValueError, TypeError): continue
                          if not (-1e100 < v < 1e100): continue
                          x=d[name]
                          x["valid"]+=1
                          if v == 0:x["zeros"]+=1
                          if v > 0:x["positive"]+=1
                          if v <= 1e-6:x["le_1e_6"]+=1
                          x["minimum"]=v if x["minimum"] is None else min(x["minimum"],v)
                          x["maximum"]=v if x["maximum"] is None else max(x["maximum"],v)
                          if len(x["unique"])<5000:x["unique"].add(v)
                  for name,x in d.items():
                      print(path.name,name, "N", x["valid"], "zeros",x["zeros"],"zero_pct",round(100*x["zeros"]/x["valid"],3) if x["valid"] else None,
                            "positive",x["positive"],"<=1e-6",x["le_1e_6"],"min",x["minimum"],"max",x["maximum"],
                            "unique_sample",len(x["unique"]),flush=True)
          for p in files:
              with p.open(encoding="utf-8-sig",newline="") as f:
                  analyze(p,f)
          p=base/"hybrid_nhmm_copula/upstream/Data/mapa_estaciones_precipitaciones_clean.csv.zip"
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              print("CHILE ZIP ENTRIES",[(f.filename,f.file_size) for f in z.infolist()],flush=True)
              assert names
              with z.open(names[0]) as input_csv:
                  import io
                  with io.TextIOWrapper(input_csv,encoding="utf-8-sig",errors="replace",newline="") as inp:
                      # Initial subset only to avoid memory/time
                      print("CHILE FIRST LINE",inp.readline()[:450])
                      print("CHILE SAMPLE NEXT LINE",inp.readline()[:450])
          PY
