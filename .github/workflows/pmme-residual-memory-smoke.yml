name: PMME RAFT Stage-II smoke tests

on:
  push:
    branches: [main]
    paths:
      - "datasets.py"
      - "model/Meta_Models/PMME_2ndStage.py"
      - "model/Meta_Models/raft_cross_city.py"
      - "tests/test_raft_cross_city.py"
      - "train_DA_OT.py"
      - "train_one_OT-*.sh"
      - "PMME.sh"
      - ".github/workflows/pmme-residual-memory-smoke.yml"
  pull_request:
    paths:
      - "datasets.py"
      - "model/Meta_Models/PMME_2ndStage.py"
      - "model/Meta_Models/raft_cross_city.py"
      - "tests/test_raft_cross_city.py"
      - "train_DA_OT.py"
      - "train_one_OT-*.sh"
      - "PMME.sh"
      - ".github/workflows/pmme-residual-memory-smoke.yml"

jobs:
  raft-stage2-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Compile changed Python files
        run: python -m py_compile datasets.py model/Meta_Models/PMME_2ndStage.py model/Meta_Models/raft_cross_city.py train_DA_OT.py tests/test_raft_cross_city.py
      - name: Check PMME launch scripts and source-only data split
        run: |
          bash -n PMME.sh train_one_OT-pems.sh train_one_OT-chengdu.sh train_one_OT-metr.sh train_one_OT-shenzhen.sh
          grep -Fq 'add_target=False' train_DA_OT.py || { echo "Source dataset must exclude the target city"; exit 1; }
          if grep -n -- "--config_file " train_one_OT-*.sh; then
            echo "Found unsupported --config_file option; train_DA_OT.py expects --config_filename"
            exit 1
          fi
      - name: Run RAFT cross-city adapter smoke tests
        run: python tests/test_raft_cross_city.py
