name: PMME Stage-I transfer smoke tests

on:
  push:
    branches: [stage-1-creativity]
    paths:
      - "model/Meta_Models/PMME.py"
      - "model/Meta_Models/stage1_transfer.py"
      - "tests/test_stage1_transfer.py"
      - ".github/workflows/stage1-transfer-smoke.yml"
  pull_request:
    paths:
      - "model/Meta_Models/PMME.py"
      - "model/Meta_Models/stage1_transfer.py"
      - "tests/test_stage1_transfer.py"
      - ".github/workflows/stage1-transfer-smoke.yml"

jobs:
  stage1-transfer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile Stage-I Python files
        run: python -m py_compile model/Meta_Models/PMME.py model/Meta_Models/stage1_transfer.py tests/test_stage1_transfer.py
      - name: Run Stage-I unit tests
        run: python -m unittest discover -s tests -p 'test_stage1_transfer.py' -v
