name: PMME diagnostic checks

on:
  push:
    branches:
      - diagnostics/pmme-target-transfer-audit-20261121
    paths:
      - 'model/Meta_Models/PMME.py'
      - 'model/Meta_Models/pmme_diagnostics.py'
      - 'train_DA_OT.py'
      - 'datasets.py'
      - 'scripts/analyze_pmme_diagnostics.py'
      - 'tests/test_pmme_diagnostics.py'
      - '.github/workflows/pmme-diagnostic-tests.yml'
  workflow_dispatch:

jobs:
  syntax-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Static syntax checks
        run: |
          python -m compileall -q datasets.py train_DA_OT.py \
            model/Meta_Models/PMME.py \
            model/Meta_Models/pmme_diagnostics.py \
            scripts/analyze_pmme_diagnostics.py \
            tests/test_pmme_diagnostics.py
      - name: Install minimal CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run synthetic diagnostic tests
        run: python -m unittest discover -s tests -p 'test_pmme_diagnostics.py' -v
