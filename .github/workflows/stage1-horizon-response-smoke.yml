name: Stage-I horizon response pattern smoke tests

on:
  push:
    branches:
      - stage-1-horizon-response-pattern
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install runtime dependencies
        run: python -m pip install numpy torch-geometric==2.6.1 gpytorch==1.14 geomloss==0.2.6 einops==0.8.1 scikit-learn pyyaml tqdm
      - name: Compile all modified Python files
        run: python -m compileall -q model/Meta_Models train_DA_OT.py datasets.py experiment_diagnostics.py
      - name: Import training CLI
        run: python train_DA_OT.py --help
      - name: Run focused joint-pattern CPU tests
        run: python -m unittest discover -s tests -p 'test_horizon_response_pattern.py' -v
