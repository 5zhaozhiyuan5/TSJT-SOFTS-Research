name: MLCEA Stage-I CPU smoke

on:
  push:
    branches: [stage-1-mlcea-official-20261122]
    paths:
      - "model/Meta_Models/mlcea.py"
      - "model/Meta_Models/mlcea_experiment_logging.py"
      - "model/Meta_Models/PMME.py"
      - "train_DA_OT.py"
      - "tests/test_mlcea.py"
      - "tests/test_mlcea_diagnostics.py"
      - ".github/workflows/mlcea-stage1-smoke.yml"
  workflow_dispatch:

jobs:
  mlcea-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only PyTorch and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest
      - name: Compile all changed Stage-I files
        run: |
          python -m py_compile model/Meta_Models/mlcea.py
          python -m py_compile model/Meta_Models/mlcea_experiment_logging.py
          python -m py_compile model/Meta_Models/PMME.py
          python -m py_compile train_DA_OT.py
          python -m py_compile tests/test_mlcea.py
          python -m py_compile tests/test_mlcea_diagnostics.py
      - name: MLCEA CPU tensor and gradient tests
        run: python -m pytest -q tests/test_mlcea.py tests/test_mlcea_diagnostics.py
