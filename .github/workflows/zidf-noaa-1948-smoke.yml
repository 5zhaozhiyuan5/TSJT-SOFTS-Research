name: ZIDF NOAA real-data 1948 manual download test

# On 2026-11-26 NOAA returned HTTP 429 for GitHub hosted runners.
# Use manual dispatch only after the server rate limit is lifted.
on:
  workflow_dispatch:

jobs:
  fetch-year:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch six official NOAA NetCDF files for 1948 (regional subset)
        run: |
          python data/zero_inflated/scripts/download_zidf_noaa.py download \
            --start-year 1948 --end-year 1948 --retries 2 --timeout 100
      - name: Verify downloaded NetCDF files
        run: |
          python data/zero_inflated/scripts/download_zidf_noaa.py verify \
            --start-year 1948 --end-year 1948
      - name: Upload 1948 NOAA NetCDF data only after successful verification
        uses: actions/upload-artifact@v4
        with:
          name: zidf-noaa-sa-1948-verified
          path: data/zero_inflated/zidf/raw/noaa_sa/subset/1948/*.nc
          if-no-files-found: error
          retention-days: 7
