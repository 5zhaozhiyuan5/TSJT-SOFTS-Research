name: GWN axis and gradient regression
on:
  push:
    branches: [iteration/20261110-gwn-shape-stub-regression]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU test dependencies
        run: |
          python -m pip install numpy PyYAML pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Synthetic unit tests (not real traffic)
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/
